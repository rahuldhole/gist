version: '3'

env:
  PATH: '/usr/local/go/bin:{{.HOME}}/.local/bin:{{.PATH}}'

includes:
  devcontainer: .devcontainer/Taskfile.yaml

tasks:
  default:
    desc: List available tasks as ordered by importance
    silent: true
    cmds:
      - task --list --sort none

  dev:
    desc: Start live development environment (preview server with watch & rebuild on change)
    vars:
      PORT: '{{.CLI_ARGS | default "8080"}}'
    cmds:
      - |
        if lsof -i :{{.PORT}} -sTCP:LISTEN >/dev/null 2>&1; then
          echo "Error: Port {{.PORT}} is already in use by another process."
          echo "Please specify a different port using: task dev -- <port>"
          echo "Example: task dev -- 8081"
          exit 1
        fi
      - task: clean
      - task: build
      - |
        task build --watch &
        go run . preview {{.PORT}}

  preview:
    desc: "Start a local preview server (default: 8080, or specify: task preview -- <port>)"
    vars:
      PORT: '{{.CLI_ARGS | default "8080"}}'
    cmds:
      - |
        if lsof -i :{{.PORT}} -sTCP:LISTEN >/dev/null 2>&1; then
          echo "Error: Port {{.PORT}} is already in use by another process."
          echo "Please specify a different port using: task preview -- <port>"
          echo "Example: task preview -- 8081"
          exit 1
        fi
      - task: clean
      - task: build
      - go run . preview {{.PORT}}

  build:
    desc: Build the app directory (Copy src to dist, inject header/footer)
    sources:
      - src/**/*
      - helpers/**/*
      - index.html
      - favicon.svg
      - "*.go"
    generates:
      - dist/**/*
    cmds:
      - go run . build

  watch:
    desc: Watch src/ for changes and rebuild automatically
    sources:
      - src/**/*
      - helpers/**/*
      - index.html
      - favicon.svg
      - "*.go"
    cmds:
      - task: build

  clean:
    desc: Remove the generated dist/ directory
    cmds:
      - go run . clean

  update-metadata:
    desc: Automatically update 'Updated:' dates in src/ based on Git changes
    cmds:
      - go run . update-metadata

  setup:
    desc: Initial setup (ensure dependencies)
    cmds:
      - go version
