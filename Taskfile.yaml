version: '3'

includes:
  devcontainer: .devcontainer/Taskfile.yaml

tasks:
  build:
    desc: Build the app directory (Copy src to dist, inject header/footer)
    sources:
      - src/**/*
      - helpers/**/*
      - index.html
      - favicon.svg
      - "*.go"
    generates:
      - dist/**/*
    cmds:
      - go run . build

  update-metadata:
    desc: Automatically update 'Updated:' dates in src/ based on Git changes
    cmds:
      - go run . update-metadata

  preview:
    desc: Start a local preview server on port 8080
    cmds:
      - task: clean
      - task: build
      - go run . preview {{.CLI_ARGS}}

  watch:
    desc: Watch src/ for changes and rebuild automatically
    sources:
      - src/**/*
      - helpers/**/*
      - index.html
      - favicon.svg
      - "*.go"
    cmds:
      - task: build

  dev:
    desc: Start live development environment (preview server with watch & rebuild on change)
    cmds:
      - task: clean
      - task: build
      - |
        task build --watch &
        go run . preview {{.CLI_ARGS}}

  clean:
    desc: Remove the generated dist/ directory
    cmds:
      - go run . clean

  setup:
    desc: Initial setup (ensure dependencies)
    cmds:
      - go version
