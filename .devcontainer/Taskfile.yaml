version: '3'

vars:
  DEVCONTAINER_BIN:
    sh: command -v devcontainer 2>/dev/null || echo "npx -y @devcontainers/cli"
  PROJECT_NAME:
    sh: basename "{{.ROOT_DIR}}"

tasks:
  up:
    desc: Start the devcontainer environment
    deps:
      - down
    cmds:
      - "{{.DEVCONTAINER_BIN}} up --workspace-folder {{.ROOT_DIR}}"

  down:
    desc: Stop and remove running devcontainer container for this workspace
    cmds:
      - docker ps -a -q --filter "label=devcontainer.local_folder={{.ROOT_DIR}}" | xargs -r docker rm -f

  build:
    desc: Build or rebuild the devcontainer image
    cmds:
      - "{{.DEVCONTAINER_BIN}} build --workspace-folder {{.ROOT_DIR}}"

  exec:
    desc: Run a command inside the devcontainer
    cmds:
      - "{{.DEVCONTAINER_BIN}} exec --workspace-folder {{.ROOT_DIR}} {{.CLI_ARGS}}"

  open:
    desc: Open current folder in devcontainer via VS Code
    cmds:
      - code --devcontainer {{.ROOT_DIR}}

  prune:
    desc: Cleanup containers and images for this devcontainer only
    cmds:
      - task: down
      - docker images -q --filter "reference=vsc-{{.PROJECT_NAME}}-*" | xargs -r docker rmi -f
